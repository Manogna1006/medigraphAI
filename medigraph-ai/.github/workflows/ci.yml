name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile $(find app scripts -name "*.py")

      # No secrets required: the whole suite is mocked at every external
      # boundary (Neo4j, Groq, OpenAlex, ChromaDB embedding downloads), so
      # it runs the same in CI as it does locally offline.
      - name: Run tests
        run: pytest tests/ -v
