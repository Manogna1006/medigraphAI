services:
  neo4j:
    image: neo4j:5.24-community
    container_name: medigraph-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/changeme
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: medigraph-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687   # override .env's localhost for container networking
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_data

volumes:
  neo4j_data:
  chroma_data:
